services:
  cubejs-ydb-tests:
    image: ghcr.io/ydb-platform/local-ydb:nightly
    container_name: cubejs-ydb-tests
    hostname: "127.0.0.1"
    platform: linux/amd64
    environment:
      GRPC_TLS_PORT: 2135
      GRPC_PORT: 2136
      YDB_USE_IN_MEMORY_PDISKS: true
    ports:
      - "2135:2135"
      - "2136:2136"