services:
  cubejs-ydb-tests:
    image: cr.yandex/yc/yandex-docker-local-ydb:latest
    container_name: cubejs-ydb-tests
    hostname: localhost
    platform: linux/amd64
    environment:
      GRPC_TLS_PORT: 2135
      GRPC_PORT: 2136
      YDB_USE_IN_MEMORY_PDISKS: true
    ports:
      - 2135:2135
      - 2136:2136